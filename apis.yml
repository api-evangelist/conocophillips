aid: conocophillips
name: ConocoPhillips
description: >-
  ConocoPhillips is a leading global exploration and production company,
  headquartered in Houston, Texas, that is uniquely equipped to deliver
  reliable, responsibly produced oil and natural gas. The company operates
  in more than a dozen countries with conventional and unconventional crude
  oil, natural gas, LNG, and natural gas liquids assets. ConocoPhillips
  does not publish public developer APIs; its external digital surface is
  organized around an investor relations portal, a vendor relations portal
  (powered by third-party platforms such as GEP and Taulia), an LNG
  technology and licensing program, and a custom sustainability report
  builder.
