description: 'FOCUS-aligned FinOps for ConocoPhillips: not an API/SaaS provider but an upstream oil and
  gas company. Treat ConocoPhillips as a non-software counterparty whose digital surface is vendor-portal
  driven; FinOps applies to the third-party SaaS that hosts those portals, not to ConocoPhillips itself.'
notes: ConocoPhillips is not a software/API vendor; this artifact is included for catalog completeness
  but is not reconciled to a billing surface.
