meters:
  - name: counterparty_invoice
    description: Procurement / commercial invoices from ConocoPhillips as counterparty (not API consumption)
    unit: invoice
    aggregation: sum
    dimensions:
      - business_unit
      - contract
principles:
  - name: Visibility
    description: Counterparty invoices flow through the procurement / treasury system rather than a developer
      console; visibility is provided by the customer's own AP/AR systems.
  - name: Allocation
    description: Allocate vendor-portal access cost via the underlying SaaS provider (Ariba / GEP / Taulia)
      rather than through ConocoPhillips directly.
  - name: Optimization
    description: No software-side optimization is applicable; commercial optimization happens through
      the master vendor / supply agreements.
  - name: Accountability
    description: Procurement and treasury own ConocoPhillips counterparty spend; no API budget owner exists.
